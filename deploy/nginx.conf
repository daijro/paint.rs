# paint.rs behind nginx (README "Web"). The site folder is dist/ after tools/web-dist.sh, or the release zip's
# folder. Put this server block in nginx.conf's http { }, with your path and port. Serve it over HTTPS (or from
# localhost) for the system clipboard, which browsers allow only in a secure context.
server {
    listen 8080;
    root /srv/paintrs;

    # The types the site serves (this map replaces mime.types in this server). The notices without an extension
    # (LICENSE, NOTICE) are text.
    types {
        text/html html;
        text/javascript js;
        application/json json;
        application/wasm wasm;
        application/gzip gz;
        image/svg+xml svg;
        font/ttf ttf;
        font/otf otf;
        font/woff2 woff2;
        text/markdown md;
        text/plain txt;
    }
    default_type text/plain;
    charset utf-8;
    charset_types text/javascript application/json text/markdown text/plain; # and text/html, always

    # Precompressed: a request for x is answered from x.gz with Content-Encoding: gzip when the client accepts gzip,
    # and from x otherwise. The wasm files and the fonts are fetched as their .gz, which goes out as it is
    # (application/gzip) and is gunzipped in the browser. Only text without a .gz beside it (the SVG icon, the
    # notices) is compressed on the fly.
    gzip_static on;
    gzip_vary on;
    gzip on;
    gzip_types image/svg+xml application/json text/markdown text/plain;

    # Names that stay across releases (index.html, the codecs, the fonts, the notices) revalidate; Trunk names the
    # app's wasm and JS, its snippets and the icon by their content.
    add_header Cache-Control "no-cache";
    location ~ ^/(paintrs-|snippets/|app-icon-) {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Object Selection's MobileSAM weights, in parts for its worker (models/mobilesam/*.safetensors.0, .1):
    # binary, sent as they are. Their names carry the SHA: kept for good.
    location ~ \.safetensors\.[0-9]+$ {
        default_type application/octet-stream;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
